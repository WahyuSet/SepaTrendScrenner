<!-- COMMAND PALETTE (CTRL + K) -->
<dialog id="cmd-palette" class="cmd-dialog" role="dialog" aria-modal="true" aria-label="Command Palette" onclick="handleCmdBackdropClick(event)">
  <div class="cmd-container">
    <div class="cmd-input-wrap">
      <span class="cmd-input-icon" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input 
        type="text" 
        id="cmd-input" 
        class="cmd-input" 
        placeholder="Cari emiten, sinyal, atau ketik perintah... (ESC untuk keluar)"
        autocomplete="off"
        spellcheck="false"
        oninput="handleCmdSearch(this.value)"
        onkeydown="handleCmdKeydown(event)"
      >
      <span class="cmd-shortcut-hint">ESC</span>
    </div>

    <div id="cmd-list" class="cmd-list">
      <!-- Generated by JavaScript -->
    </div>

    <div class="cmd-footer">
      <div class="cmd-tip">
        <kbd>↑</kbd> <kbd>↓</kbd> Navigasi
        <kbd>↵</kbd> Pilih
        <kbd>ESC</kbd> Tutup
      </div>
      <div class="cmd-footer-tag">Tirexxz Screnner</div>
    </div>
  </div>
</dialog>
