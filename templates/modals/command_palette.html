<!-- COMMAND PALETTE (CTRL + K) -->
<dialog id="cmd-palette" class="cmd-dialog" onclick="handleCmdBackdropClick(event)">
  <div class="cmd-container">
    <div class="cmd-input-wrap">
      <span class="cmd-input-icon">🔍</span>
      <input 
        type="text" 
        id="cmd-input" 
        class="cmd-input" 
        placeholder="Cari emiten, sinyal, atau ketik perintah... (ESC untuk keluar)"
        autocomplete="off"
        spellcheck="false"
        oninput="handleCmdSearch(this.value)"
        onkeydown="handleCmdKeydown(event)"
      >
      <span class="cmd-shortcut-hint">ESC</span>
    </div>

    <div id="cmd-list" class="cmd-list">
      <!-- Generated by JavaScript -->
    </div>

    <div class="cmd-footer">
      <div class="cmd-tip">
        <kbd>↑</kbd> <kbd>↓</kbd> Navigasi
        <kbd>↵</kbd> Pilih
        <kbd>ESC</kbd> Tutup
      </div>
      <div class="cmd-footer-tag">Tirexxz Screnner</div>
    </div>
  </div>
</dialog>
