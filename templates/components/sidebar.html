<!-- ==========================================================================
     ERGONOMIC ENTERPRISE SIDEBAR COMPONENT (250px)
     ========================================================================== -->
<aside class="sidebar">
  <div class="sidebar-top">
    <!-- 1. BRAND HEADER -->
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-dino-badge" title="Tirexxz Screnner">
          <span class="dino-emoji">🦖</span>
        </div>
        <div class="brand-title">
          <h2>Tirexxz <span>Screnner</span></h2>
        </div>
      </div>
      <button class="btn-sidebar-close" id="btn-sidebar-close" onclick="closeMobileSidebar()" aria-label="Tutup Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- 2. TOP OMNIBAR SEARCH TRIGGER (LINEAR / RAYCAST STYLE) -->
    <div class="sidebar-search-area">
      <button class="sidebar-search-trigger" onclick="openCommandPalette()" title="Cari emiten atau perintah (Ctrl + K)">
        <div class="search-trigger-left">
          <span class="search-icon">🔍</span>
          <span class="search-placeholder">Cari emiten, aksi...</span>
        </div>
        <kbd class="search-kbd">Ctrl K</kbd>
      </button>
    </div>

    <!-- 3. ZONE 1: SCREENER NAVIGATION -->
    <div class="sidebar-section">
      <div class="nav-section-label">Screeners</div>
      <button class="nav-item active" id="nav-sepa" onclick="switchScreener('sepa')">
        <div class="nav-item-left">
          <span class="nav-item-icon">📈</span>
          <span class="nav-item-text">SEPA Trend</span>
        </div>
        <span class="nav-item-badge" id="badge-sepa">—</span>
      </button>

      <button class="nav-item" id="nav-rsi-div" onclick="switchScreener('rsi-div')">
        <div class="nav-item-left">
          <span class="nav-item-icon">📉</span>
          <span class="nav-item-text">RSI Divergence</span>
        </div>
        <span class="nav-item-badge" id="badge-rsi-div">—</span>
      </button>

      <button class="nav-item" id="nav-prebreakout" onclick="switchScreener('prebreakout')">
        <div class="nav-item-left">
          <span class="nav-item-icon">🎯</span>
          <span class="nav-item-text">Pre-Breakout</span>
        </div>
        <span class="nav-item-badge" id="badge-prebreakout">—</span>
      </button>

      <button class="nav-item" id="nav-quality" onclick="switchScreener('quality')">
        <div class="nav-item-left">
          <span class="nav-item-icon">💎</span>
          <span class="nav-item-text">Quality Setup</span>
        </div>
        <span class="nav-item-badge" id="badge-quality">—</span>
      </button>
    </div>

    <!-- ZONE 1.5: PORTFOLIO & TOOLS -->
    <div class="sidebar-section">
      <div class="nav-section-label">Portofolio & Tools</div>
      <button class="nav-item" id="nav-watchlist" onclick="switchScreener('watchlist')">
        <div class="nav-item-left">
          <span class="nav-item-icon">⭐</span>
          <span class="nav-item-text">Watchlist & Journal</span>
        </div>
        <span class="nav-item-badge" id="badge-watchlist">0</span>
      </button>

      <button class="nav-item" id="nav-position-sizing" onclick="openPositionCalculator()">
        <div class="nav-item-left">
          <span class="nav-item-icon">🧮</span>
          <span class="nav-item-text">Position Sizing</span>
        </div>
        <span class="nav-item-badge hot">CALC</span>
      </button>

      <button class="nav-item" id="nav-backtest" onclick="switchScreener('backtest')">
        <div class="nav-item-left">
          <span class="nav-item-icon">🧪</span>
          <span class="nav-item-text">Signal Backtest Lab</span>
        </div>
        <span class="nav-item-badge new">LAB</span>
      </button>
    </div>

    <!-- 4. ZONE 2: SCANNER ENGINE -->
    <div class="sidebar-section">
      <div class="nav-section-label">Engine & Scanning</div>
      <button id="btn-scan" class="btn-sidebar-scan" onclick="triggerScan()" title="Scan seluruh universe saham IDX">
        <span class="btn-scan-icon">⚡</span>
        <span id="btn-scan-text">Scan IDX Sekarang</span>
      </button>

      <!-- REAL-TIME SCAN PROGRESS CARD -->
      <div id="scan-progress-box" class="sidebar-scan-progress hidden">
        <div class="scan-progress-meta">
          <span id="scan-current-ticker" class="scan-current-ticker">Memulai scan...</span>
          <span id="scan-progress-count" class="scan-count-mini">0/0</span>
        </div>
        <div class="scan-progress-bar-wrap">
          <div id="scan-progress-fill" class="scan-progress-fill-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. ZONE 3: SYSTEM STATUS & FOOTER -->
  <div class="sidebar-bottom">
    <div class="system-status-card">
      <div class="system-status-header">
        <div class="system-status-pill {{ market_status.status if market_status else 'closed' }}" id="sidebar-market-pill" title="{{ market_status.detail if market_status else 'Status Pasar Bursa Efek Indonesia' }}">
          <span class="status-live-dot" id="sidebar-market-dot"></span>
          <span class="status-text" id="sidebar-market-text">{{ market_status.label if market_status else 'IDX Closed' }}</span>
        </div>
        <button class="btn-sidebar-refresh" onclick="refreshActiveScreener()" title="Muat ulang status pasar & cache hasil scan" aria-label="Refresh status">
          <svg class="refresh-icon-svg" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
      <div class="system-status-time">
        <span class="time-label">Update:</span>
        <span id="sidebar-last-scan" class="time-val">{{ last_scan_time or 'Belum pernah scan' }}</span>
      </div>
      <!-- LIVE API QUOTA TRACKER -->
      <div class="system-status-quota" id="sidebar-quota-box" title="Kuota Request Harian IDX Edge API">
        <div class="quota-meta">
          <span class="quota-label">API Quota</span>
          <span id="sidebar-quota-text" class="quota-text">... / 1000</span>
        </div>
        <div class="quota-progress-track">
          <div id="sidebar-quota-bar" class="quota-progress-fill" style="width: 0%;"></div>
        </div>
      </div>
      <!-- ADMIN SESSION & LOGOUT BAR -->
      <div class="sidebar-user-card">
        <div class="user-meta">
          <div class="user-avatar-badge">A</div>
          <div class="user-info">
            <span class="user-name">Administrator</span>
            <span class="user-status-label"><span class="user-live-dot"></span>Online</span>
          </div>
        </div>
        <a href="/logout" class="btn-sidebar-logout" title="Keluar dari sesi Admin" onclick="return confirm('Apakah Anda yakin ingin keluar dari sesi Admin?')" aria-label="Logout">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </a>
      </div>
    </div>

    <div class="sidebar-footer">
      <span>Tirexxz Screnner</span>
      <span>v2.0</span>
    </div>
  </div>
</aside>
