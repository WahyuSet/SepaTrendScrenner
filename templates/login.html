<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirexxz Screnner: Masuk Admin</title>
  <meta name="description" content="Halaman masuk admin Tirexxz Screnner.">

  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <!-- Typography: Plus Jakarta Sans & JetBrains Mono (Google Fonts CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Theme before first paint: saved choice, else light (Design.md §3.6) -->
  <script>
    (function () {
      var theme = 'light';
      try { if (localStorage.getItem('theme') === 'dark') theme = 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <!-- Font Stack & Stylesheet -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-body">

  <main class="login-wrapper">
    <div class="login-card-container">
      
      <!-- Brand header -->
      <div class="login-brand-header">
        <p class="brand-name-title">Tirexxz <span>Screnner</span></p>
        <h1 class="login-headline">Masuk sebagai Admin</h1>
        <p class="login-subtext">Masukkan username dan password admin untuk membuka workstation.</p>
      </div>

      <!-- Feedback alert (hidden by default) -->
      <div id="login-alert" class="login-alert hidden" role="alert">
        <svg class="alert-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="alert-message" id="alert-message">Kredensial tidak valid</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="login-form" autocomplete="off" novalidate onsubmit="handleLoginSubmit(event)">
        
        <!-- Username Field -->
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input" 
              placeholder="Masukkan username admin" 
              required 
              autofocus
            >
          </div>
        </div>

        <!-- Password Field with Show/Hide Toggle -->
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="form-label">Password</label>
          </div>
          <div class="input-wrap">
            <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input" 
              placeholder="Masukkan password" 
              required
            >
            <button 
              type="button" 
              class="btn-toggle-password" 
              id="btn-toggle-password" 
              onclick="togglePasswordVisibility()"
              aria-label="Tampilkan password"
              aria-pressed="false"
            >
              <svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="remember" name="remember" value="true" checked>
            <span class="checkmark"></span>
            <span class="checkbox-label">Ingat sesi ini selama 30 hari</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-login-submit" class="btn-login-submit">
          <span class="btn-text">Masuk ke Workstation</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>

      <div class="login-card-footer">
        <span>Akses terbatas untuk admin.</span>
      </div>

    </div>

    <p class="login-page-footer">Tirexxz Screnner v2.0 · © 2026</p>
  </main>

  <script src="/static/js/login.js"></script>
</body>
</html>
