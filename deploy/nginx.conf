# ==============================================================================
# TIREXXZ SCRENNER - NGINX REVERSE PROXY CONFIGURATION
# Letakkan file ini di: /etc/nginx/sites-available/tirexxz
# Lalu buat symlink: sudo ln -s /etc/nginx/sites-available/tirexxz /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan nama domain atau subdomain Anda (atau IP server jika belum punya domain)
    server_name yourdomain.com screener.yourdomain.com;

    # Log file
    access_log /var/log/nginx/tirexxz_access.log;
    error_log /var/log/nginx/tirexxz_error.log;

    # Max upload size
    client_max_body_size 20M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression untuk performa cepat & hemat bandwidth
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 1. SERVE STATIC FILES LANGSUNG OLEH NGINX (SANGAT CEPAT & HEMAT CPU)
    location /static/ {
        alias /var/www/tirexxz-screener/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 2. REVERSE PROXY KE GUNICORN (PORT 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Forward header penting (IP asli client, host, dan protokol)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (jika dibutuhkan di masa depan)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings (120 detik untuk komputasi batch scan)
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
